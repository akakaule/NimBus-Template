# Deploys NimBus into your Azure subscription from the published release artifacts.
#
# Everything it needs comes from nuget.org: the `nb` CLI carries the bicep templates and
# downloads the prebuilt Resolver and WebApp for its own version. There is no submodule, no
# Node.js and no build of NimBus — the NimBus sources are not involved at all.
#
# It deploys on every push to main. A run is reproducible from this file alone, because both
# versions that decide what lands — the CLI and the platform catalog — are pinned here, so
# the environment changes only when a commit changes this file. Still runnable by hand.
#
# Replace every parameter marked REPLACE before the first run.
trigger:
  branches:
    include:
      - main

# Deploy on merge, not on proposal — a PR build would push a branch's changes onto the
# shared environment before anyone approved them.
pr: none

parameters:
  # REPLACE: short identifier for your solution. It is the stem of the Azure resource names
  # this creates (sb-<solutionId>-<environment>, webapp-<solutionId>-<environment>-management,
  # …), so pick something short, lowercase and stable — changing it later provisions a
  # parallel set of resources rather than renaming the existing ones.
  - name: solutionId
    displayName: "Solution identifier used in Azure resource names"
    type: string
    default: acme
  - name: environment
    displayName: "Environment name (e.g. dev, staging, prod)"
    type: string
    default: dev
  # REPLACE: created if it does not already exist.
  - name: resourceGroup
    displayName: "Azure resource group name (created if missing)"
    type: string
    default: rg-acme-dev
  # REPLACE: the Azure service connection in your ADO project. Its identity needs Owner — or
  # Contributor plus Role Based Access Control Administrator — on the target scope, because
  # the deployment creates role assignments. See NimBus docs/azure-requirements.md.
  - name: azureServiceConnection
    displayName: "Azure service connection name"
    type: string
    default: acme-azure
  # REPLACE: deliberately an all-zero placeholder, so a first run against an unconfigured
  # pipeline fails immediately instead of deploying somewhere unintended.
  - name: subscriptionId
    displayName: "Azure subscription to deploy into"
    type: string
    default: 00000000-0000-0000-0000-000000000000
  # Applies to new resources only; existing ones keep the region they were created in.
  - name: location
    displayName: "Azure region for new resources (existing resources keep their region)"
    type: string
    default: westeurope
  - name: resolverPlan
    displayName: "Resolver hosting plan: FlexConsumption | ElasticPremium (empty = keep existing plan)"
    type: string
    default: FlexConsumption
  - name: managementPlanSku
    displayName: "Management App Service Plan SKU (empty = keep existing SKU)"
    type: string
    default: B1
  # Resolver capacity. The Resolver is bounded by what the message store can absorb, not by
  # Service Bus: 200 sessions per instance produced a throttling storm in production, which is
  # why NimBus defaults to 16. Raise it together with the store's throughput, not instead of it.
  #
  # 'auto' rather than an empty string for the same reason as identityAdminEmail below: an
  # empty default renders as Required in the run dialog and blocks the Run button.
  - name: resolverMaxSessions
    displayName: "Resolver Service Bus sessions per instance, 1-200 ('auto' = 16)"
    type: string
    default: auto
  - name: resolverMaxInstances
    displayName: "Resolver instance ceiling: ElasticPremium 0-10 (0 = no cap), FlexConsumption 1-1000 ('auto' = no cap / 100)"
    type: string
    default: auto
  # Which store the Resolver and the WebApp read and write. Toggling this switches the
  # provider the deployed apps use; it does NOT migrate anything, so message history, audit
  # trail and metrics written to the other store stay there and stop being visible.
  - name: storageProvider
    displayName: "Message store"
    type: string
    default: sqlserver
    values:
      - sqlserver
      - cosmos
  # sqlserver only. 'provision' deploys the Azure SQL server and database from the bicep
  # templates; 'external' points the apps at a server you already run, read from the secret
  # variable NIMBUS_SQL_CONNECTION_STRING.
  - name: sqlMode
    displayName: "SQL: provision a server, or use an external one"
    type: string
    default: provision
    values:
      - provision
      - external
  - name: sqlAdminLogin
    displayName: "SQL admin login (sqlserver + provision)"
    type: string
    default: nimbusadmin
  # The WebApp needs a sign-in, and the bicep creates no Entra app registration: if you use
  # Entra, AzureAd__ClientId and friends are configured by hand on the WebApp and every
  # deployment carries them forward — which also means a torn-down environment comes back
  # without them, and a WebApp with no sign-in configured refuses to start.
  #
  # Setting this instead seeds ASP.NET Core Identity: a username/password admin created on
  # first boot, described entirely by this pipeline and therefore reproducible after a
  # teardown. It needs the SQL store (the accounts live in that database) and the
  # NIMBUS_IDENTITY_ADMIN_PASSWORD secret. Both auth paths can run at once; the WebApp accepts
  # either sign-in.
  #
  # 'none' rather than an empty string: Azure DevOps renders a parameter whose default is ""
  # as Required in the run dialog and greys out the Run button, so an "unset" default has to
  # be a word.
  - name: identityAdminEmail
    displayName: "Seed this address as the first admin (sqlserver only; 'none' = leave auth alone)"
    type: string
    default: none
  # 'auto' lets the CLI derive sql-{solutionId}-{environment}. Name it explicitly when that
  # DNS name is taken: SQL server names are globally unique, and a deleted one stays reserved
  # for 24-72 hours.
  #
  # 'auto' rather than an empty string for the same reason as identityAdminEmail above: an
  # empty default renders as Required in the run dialog and blocks the Run button.
  - name: sqlServerName
    displayName: "SQL server name ('auto' = sql-<solutionId>-<environment>)"
    type: string
    default: auto
  # Pinned deliberately rather than 'latest': the CLI version selects the deployment
  # artifacts, so an upgrade should be a reviewed change to this file, never something
  # a release on nuget.org does to a running environment on its own.
  - name: nimbusVersion
    displayName: "Akaule.NimBus.CommandLine version to install and deploy"
    type: string
    default: 4.8.0
  # REPLACE: your catalog, published by the platform repo (../platform in this template).
  # It decides the Service Bus topology and what the management UI renders, so the version is
  # pinned rather than floated — a merge in the platform repo must not reroute a running
  # environment on its own. Moving the pin is a reviewed change here.
  #
  # Leave it empty to deploy NimBus's built-in demo catalog (Storefront/Billing/Warehouse),
  # which is useful for a first run before your own catalog is published.
  - name: platformPackage
    displayName: "Platform catalog package (<Id>@<Version>, empty = NimBus's built-in catalog)"
    type: string
    default: Acme.Platform@1.0.0
  # REPLACE: the feed base, NOT the service index. The CLI appends /v3/index.json itself and
  # reads the flat-container address from it, so passing a full index URL 404s in a way that
  # reads like a missing package.
  #
  # A project-scoped feed carries a project segment as below; an organisation-scoped feed has
  # none (https://pkgs.dev.azure.com/<org>/_packaging/<feed>/nuget). Addressing the wrong
  # scope fails with "the feed with ID '<feed>' doesn't exist", which reads like a missing
  # feed. Prefer the project's id over its name — no percent-encoding, survives a rename.
  - name: platformFeed
    displayName: "Feed serving the platform package (no /v3/index.json)"
    type: string
    default: https://pkgs.dev.azure.com/acme/00000000-0000-0000-0000-000000000000/_packaging/acme-platform/nuget

  # ---------- Private networking (opt-in; NimBus docs/private-networking.md) ----------
  #
  # 'private' puts Service Bus, the store, the Functions storage and both apps behind private
  # endpoints in subnets you provide, and turns public access off. Service Bus must be
  # Premium for that, and the run must come from an agent inside the network: topology
  # provisioning, the app deploys and the verify step all talk to private endpoints.
  #
  # nb records the network setup as tags on the resource group, so only the first private run
  # needs the subnets and DNS settings; later runs reproduce the record. 'auto' below means
  # "pass nothing": the recorded setting, else the CLI's default (public).
  - name: agentPool
    displayName: "Agent pool ('Azure Pipelines' = Microsoft-hosted; private mode needs a pool inside the network)"
    type: string
    default: Azure Pipelines
  - name: networkMode
    displayName: "Network mode ('auto' = the recorded mode, else public)"
    type: string
    default: auto
    values:
      - auto
      - public
      - private
  # Moving an existing public deployment takes two runs: one with this ticked, which adds the
  # private endpoints, DNS and VNet integration while public access stays on, then one
  # without, which locks it. Per run, never recorded.
  - name: allowPublicAccess
    displayName: "Private mode: transition pass that keeps public access on (pass 1 of moving an existing deployment)"
    type: boolean
    default: false
  - name: skipTransition
    displayName: "Private mode: switch an existing deployment straight to private, accepting downtime"
    type: boolean
    default: false
  - name: privateEndpointSubnetId
    displayName: "Subnet id the private endpoints take their addresses from (not delegated)"
    type: string
    default: auto
  - name: resolverSubnetId
    displayName: "Subnet id for the Resolver's VNet integration (Flex: Microsoft.App/environments; EP: Microsoft.Web/serverFarms)"
    type: string
    default: auto
  - name: webAppSubnetId
    displayName: "Subnet id for the WebApp's VNet integration (delegated to Microsoft.Web/serverFarms)"
    type: string
    default: auto
  # 'create' only for a VNet dedicated to NimBus: a linked zone answers for every name of its
  # type in that VNet, so it would take over resolution for other workloads sharing it.
  - name: privateDns
    displayName: "Who owns the privatelink DNS zones: NimBus (create), a hub resource group (existing), or your DNS (external)"
    type: string
    default: auto
    values:
      - auto
      - create
      - existing
      - external
  - name: privateDnsZoneScope
    displayName: "privateDns 'existing': resource group id holding the privatelink zones"
    type: string
    default: auto
  - name: monitorPrivateLink
    displayName: "How telemetry reaches Azure Monitor in private mode ('none' = through your firewall)"
    type: string
    default: auto
    values:
      - auto
      - none
  - name: serviceBusCapacity
    displayName: "Service Bus Premium messaging units ('auto' = existing, else 1)"
    type: string
    default: auto
    values:
      - auto
      - "1"
      - "2"
      - "4"
      - "8"
      - "16"
  # Azure cannot convert a Standard namespace to Premium in place, so moving an existing
  # deployment to private means a new Premium namespace under a new name. nb records it, and
  # later runs and the verify step follow the record.
  - name: serviceBusNamespaceName
    displayName: "Service Bus namespace name ('auto' = the recorded one, else sb-<solutionId>-<environment>)"
    type: string
    default: auto
  - name: dnsWait
    displayName: "Minutes nb waits for the private endpoints to resolve from the agent ('auto' = 10)"
    type: string
    default: auto

# Microsoft-hosted unless agentPool names a pool of your own, which private mode requires:
# a hosted agent cannot resolve or reach the private endpoints.
pool:
  name: ${{ parameters.agentPool }}
  ${{ if eq(parameters.agentPool, 'Azure Pipelines') }}:
    vmImage: ubuntu-latest

steps:
  # The checkout is only here for this file. Nothing in the repository is read by the
  # deployment itself — the applications come from nuget.org and the catalog from your feed.
  - checkout: self

  # The only toolchain requirement: the SDK that installs the tool. No Node.js, because the
  # WebApp's SPA is already built inside the downloaded artifact.
  - task: UseDotNet@2
    displayName: Setup .NET 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: |
      set -euo pipefail
      dotnet tool install --global Akaule.NimBus.CommandLine --version "${{ parameters.nimbusVersion }}"
      echo "##vso[task.prependpath]$HOME/.dotnet/tools"
    displayName: Install nb CLI from nuget.org

  - task: AzureCLI@2
    displayName: "Deploy: infra + topology + apps (nb setup)"
    env:
      NB_RESOLVER_PLAN: ${{ parameters.resolverPlan }}
      NB_MANAGEMENT_PLAN_SKU: ${{ parameters.managementPlanSku }}
      NB_PLATFORM_PACKAGE: ${{ parameters.platformPackage }}
      NB_STORAGE_PROVIDER: ${{ parameters.storageProvider }}
      NB_SQL_MODE: ${{ parameters.sqlMode }}
      NB_SQL_ADMIN_LOGIN: ${{ parameters.sqlAdminLogin }}
      NB_SQL_SERVER_NAME: ${{ parameters.sqlServerName }}
      NB_IDENTITY_ADMIN_EMAIL: ${{ parameters.identityAdminEmail }}
      NB_RESOLVER_MAX_SESSIONS: ${{ parameters.resolverMaxSessions }}
      NB_RESOLVER_MAX_INSTANCES: ${{ parameters.resolverMaxInstances }}
      NB_AGENT_POOL: ${{ parameters.agentPool }}
      NB_NETWORK_MODE: ${{ parameters.networkMode }}
      NB_ALLOW_PUBLIC_ACCESS: ${{ parameters.allowPublicAccess }}
      NB_SKIP_TRANSITION: ${{ parameters.skipTransition }}
      NB_PRIVATE_ENDPOINT_SUBNET_ID: ${{ parameters.privateEndpointSubnetId }}
      NB_RESOLVER_SUBNET_ID: ${{ parameters.resolverSubnetId }}
      NB_WEBAPP_SUBNET_ID: ${{ parameters.webAppSubnetId }}
      NB_PRIVATE_DNS: ${{ parameters.privateDns }}
      NB_PRIVATE_DNS_ZONE_SCOPE: ${{ parameters.privateDnsZoneScope }}
      NB_MONITOR_PRIVATE_LINK: ${{ parameters.monitorPrivateLink }}
      NB_SERVICE_BUS_CAPACITY: ${{ parameters.serviceBusCapacity }}
      NB_SERVICE_BUS_NAMESPACE_NAME: ${{ parameters.serviceBusNamespaceName }}
      NB_DNS_WAIT: ${{ parameters.dnsWait }}
      # The feed is private, so the CLI needs a credential to read it. It goes out as the
      # password half of Basic auth over HTTPS; the build service identity needs read access
      # to the feed for this to resolve.
      NIMBUS_PLATFORM_FEED_TOKEN: $(System.AccessToken)
      # Mapped only on the SQL path, so a Cosmos run never carries a database credential in
      # its environment. Both are read by the CLI from the environment rather than passed as
      # arguments, which keeps them out of the command line and the run log. Define them as
      # *secret* pipeline variables; the guard below fails the run if one is missing.
      ${{ if eq(parameters.storageProvider, 'sqlserver') }}:
        NIMBUS_SQL_ADMIN_PASSWORD: $(NIMBUS_SQL_ADMIN_PASSWORD)
        NIMBUS_SQL_CONNECTION_STRING: $(NIMBUS_SQL_CONNECTION_STRING)
        # Seeded into the Identity store on first boot. @secure() in the bicep, so it stays
        # out of the deployment history as well as out of the log.
        NIMBUS_IDENTITY_ADMIN_PASSWORD: $(NIMBUS_IDENTITY_ADMIN_PASSWORD)
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        # Everything that can be decided without Azure is decided first, so a misconfigured
        # run fails before it creates a resource group it will not fill.
        EXTRA_ARGS=()
        if [ -n "$NB_RESOLVER_PLAN" ]; then EXTRA_ARGS+=(--resolver-plan "$NB_RESOLVER_PLAN"); fi
        if [ -n "$NB_MANAGEMENT_PLAN_SKU" ]; then EXTRA_ARGS+=(--management-plan-sku "$NB_MANAGEMENT_PLAN_SKU"); fi
        # One catalog for both halves of the deployment: it provisions the topology and its
        # assemblies are staged into the WebApp zip, so the UI shows these endpoints too.
        if [ -n "$NB_PLATFORM_PACKAGE" ]; then
          EXTRA_ARGS+=(--platform-package "$NB_PLATFORM_PACKAGE" --platform-feed "${{ parameters.platformFeed }}")
        fi

        EXTRA_ARGS+=(--storage-provider "$NB_STORAGE_PROVIDER")
        if [ "$NB_STORAGE_PROVIDER" = "sqlserver" ]; then
          EXTRA_ARGS+=(--sql-mode "$NB_SQL_MODE")
          if [ "$NB_SQL_MODE" = "provision" ]; then
            # An undefined pipeline variable expands to the literal '$(NAME)', so an empty
            # check alone would let that reach Azure as the admin password. Reject both.
            case "${NIMBUS_SQL_ADMIN_PASSWORD:-}" in
              ''|'$('*)
                echo "##vso[task.logissue type=error]Define a secret pipeline variable NIMBUS_SQL_ADMIN_PASSWORD to provision Azure SQL, or switch sqlMode to 'external'."
                exit 1
                ;;
            esac
            EXTRA_ARGS+=(--sql-admin-login "$NB_SQL_ADMIN_LOGIN")
            # 'auto' and empty both mean "let the CLI derive it".
            if [ -n "$NB_SQL_SERVER_NAME" ] && [ "$NB_SQL_SERVER_NAME" != "auto" ]; then
              EXTRA_ARGS+=(--sql-server-name "$NB_SQL_SERVER_NAME")
            fi
          else
            case "${NIMBUS_SQL_CONNECTION_STRING:-}" in
              ''|'$('*)
                echo "##vso[task.logissue type=error]sqlMode 'external' needs a secret pipeline variable NIMBUS_SQL_CONNECTION_STRING pointing at your SQL server."
                exit 1
                ;;
            esac
          fi
        fi

        # Sign-in. Without one of the two paths the WebApp refuses to start, so /alive never
        # answers; this fails the run before deploying rather than leaving an environment
        # nobody can log into.
        if [ -n "$NB_IDENTITY_ADMIN_EMAIL" ] && [ "$NB_IDENTITY_ADMIN_EMAIL" != "none" ]; then
          if [ "$NB_STORAGE_PROVIDER" != "sqlserver" ]; then
            echo "##vso[task.logissue type=error]identityAdminEmail requires storageProvider 'sqlserver' — the accounts live in the same database. Clear it and configure AzureAd__* on the WebApp instead."
            exit 1
          fi
          case "${NIMBUS_IDENTITY_ADMIN_PASSWORD:-}" in
            ''|'$('*)
              echo "##vso[task.logissue type=error]Define a secret pipeline variable NIMBUS_IDENTITY_ADMIN_PASSWORD to seed the first admin, or clear identityAdminEmail."
              exit 1
              ;;
          esac
          EXTRA_ARGS+=(--identity-admin-email "$NB_IDENTITY_ADMIN_EMAIL")
        fi

        # nb parses these numbers itself, but only after `az group create` below has run.
        for SETTING in "resolverMaxSessions=$NB_RESOLVER_MAX_SESSIONS" "resolverMaxInstances=$NB_RESOLVER_MAX_INSTANCES" "dnsWait=$NB_DNS_WAIT"; do
          case "${SETTING#*=}" in
            auto|'') ;;
            *[!0-9]*)
              echo "##vso[task.logissue type=error]${SETTING%%=*} must be a whole number or 'auto', not '${SETTING#*=}'."
              exit 1
              ;;
          esac
        done

        # A hosted agent cannot resolve the private endpoints, so nb's pre-flight check would
        # stop the run only after infra had already locked the data services.
        if [ "$NB_NETWORK_MODE" = "private" ] && [ "$NB_AGENT_POOL" = "Azure Pipelines" ]; then
          echo "##vso[task.logissue type=error]networkMode 'private' needs agentPool set to a pool inside the network; a Microsoft-hosted agent cannot reach the private endpoints."
          exit 1
        fi

        # 'auto' (or empty) passes nothing, so nb keeps the setting recorded on the resource
        # group by an earlier run, or falls back to its own default.
        add_option() { if [ -n "$2" ] && [ "$2" != "auto" ]; then EXTRA_ARGS+=("$1" "$2"); fi; }
        add_option --resolver-max-sessions "$NB_RESOLVER_MAX_SESSIONS"
        add_option --resolver-max-instances "$NB_RESOLVER_MAX_INSTANCES"
        add_option --network-mode "$NB_NETWORK_MODE"
        add_option --private-endpoint-subnet-id "$NB_PRIVATE_ENDPOINT_SUBNET_ID"
        add_option --resolver-subnet-id "$NB_RESOLVER_SUBNET_ID"
        add_option --webapp-subnet-id "$NB_WEBAPP_SUBNET_ID"
        add_option --private-dns "$NB_PRIVATE_DNS"
        add_option --private-dns-zone-scope "$NB_PRIVATE_DNS_ZONE_SCOPE"
        add_option --monitor-private-link "$NB_MONITOR_PRIVATE_LINK"
        add_option --service-bus-capacity "$NB_SERVICE_BUS_CAPACITY"
        add_option --service-bus-namespace-name "$NB_SERVICE_BUS_NAMESPACE_NAME"
        add_option --dns-wait "$NB_DNS_WAIT"
        if [ "$NB_ALLOW_PUBLIC_ACCESS" = "True" ]; then EXTRA_ARGS+=(--allow-public-access); fi
        if [ "$NB_SKIP_TRANSITION" = "True" ]; then EXTRA_ARGS+=(--skip-transition); fi

        az account set --subscription "${{ parameters.subscriptionId }}"
        az group create --name "${{ parameters.resourceGroup }}" --location "${{ parameters.location }}" --output none
        nb setup \
          --solution-id "${{ parameters.solutionId }}" \
          --environment "${{ parameters.environment }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --location "${{ parameters.location }}" \
          "${EXTRA_ARGS[@]}"

  # Proves the deployed apps are the artifacts this CLI version carries, which is the
  # whole claim of the artifact method.
  #
  # The version deliberately does NOT come from /api/app/stats. That endpoint stays
  # anonymous so liveness probes keep working, but its payload is authenticated-only
  # (NimBus GH#93) — environment name, exact version and backend topology would let an
  # unauthenticated scanner fingerprint the deployment. An anonymous caller gets
  # {"env":null,"platformVersion":null,...}, so there is nothing to assert against, and
  # this pipeline's service principal is an Azure RBAC identity rather than a WebApp
  # user, so it cannot sign in to that API either.
  #
  # What it can do is read the deployed files over SCM/Kudu with the same ARM token it
  # deployed with. NimBus.WebApp.deps.json carries the version the release build stamped
  # on the assemblies — the same value stats reports to a signed-in operator.
  - task: AzureCLI@2
    displayName: "Verify: deployed version matches the CLI"
    env:
      # The last assertion re-exports the pinned catalog to compare it against the
      # provisioned topology, which means reading the private feed again.
      NIMBUS_PLATFORM_FEED_TOKEN: $(System.AccessToken)
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az account set --subscription "${{ parameters.subscriptionId }}"
        APP="webapp-${{ parameters.solutionId }}-${{ parameters.environment }}-management"
        HOST=$(az webapp show \
          --resource-group "${{ parameters.resourceGroup }}" \
          --name "$APP" \
          --query defaultHostName --output tsv)
        SCM=$(az webapp show \
          --resource-group "${{ parameters.resourceGroup }}" \
          --name "$APP" \
          --query "enabledHostNames[?contains(@, '.scm.')] | [0]" --output tsv)
        echo "Management WebApp: https://${HOST}"

        # The app has just been zip-deployed and may still be starting.
        STATUS=000
        for attempt in $(seq 1 20); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://${HOST}/alive" || true)
          if [ "$STATUS" = "200" ]; then break; fi
          sleep 15
        done
        if [ "$STATUS" != "200" ]; then
          echo "##vso[task.logissue type=error]The management WebApp never reported healthy on /alive (last status ${STATUS})."
          exit 1
        fi
        echo "Management WebApp is live."

        # Kudu accepts the ARM token, so no publishing profile or basic SCM credentials
        # are needed — the deployment identity is already entitled to read the site.
        TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken --output tsv)
        # Downloaded to a file rather than a variable: deps.json is ~90 KB, and
        # `echo "$DEPS" | grep -q` would have grep close the pipe on its first match,
        # killing echo with SIGPIPE and failing the whole pipeline under `pipefail`.
        DEPS=$(mktemp)
        DOWNLOADED=false
        for attempt in $(seq 1 5); do
          if curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://${SCM}/api/vfs/site/wwwroot/NimBus.WebApp.deps.json" --output "$DEPS"; then
            DOWNLOADED=true
            break
          fi
          sleep 10
        done
        if [ "$DOWNLOADED" != true ]; then
          echo "##vso[task.logissue type=error]Could not read NimBus.WebApp.deps.json from https://${SCM}, so the deployed version could not be confirmed."
          exit 1
        fi

        if ! grep -q "\"NimBus.WebApp/${{ parameters.nimbusVersion }}\"" "$DEPS"; then
          echo "Deployed WebApp: $(grep -o '"NimBus.WebApp/[^"]*"' "$DEPS" | sort -u | tr '\n' ' ')"
          echo "##vso[task.logissue type=error]Deployed WebApp does not match the pinned CLI version ${{ parameters.nimbusVersion }}."
          exit 1
        fi
        echo "Deployed WebApp assemblies are stamped ${{ parameters.nimbusVersion }}."

        # ---------- and that the pinned catalog is the one running ----------
        if [ -z "${{ parameters.platformPackage }}" ]; then
          echo "No platform package pinned; this environment runs NimBus's built-in demo catalog."
          exit 0
        fi

        # The CLI records what it staged into the site. Absent settings mean the WebApp fell
        # back to its built-in catalog, which looks like a successful deployment of the wrong
        # thing — the failure mode this assertion exists for.
        PLATFORM_TYPE=$(az webapp config appsettings list \
          --resource-group "${{ parameters.resourceGroup }}" --name "$APP" \
          --query "[?name=='NimBus__PlatformType'].value | [0]" --output tsv)
        PLATFORM_ASSEMBLY=$(az webapp config appsettings list \
          --resource-group "${{ parameters.resourceGroup }}" --name "$APP" \
          --query "[?name=='NimBus__PlatformAssembly'].value | [0]" --output tsv)
        if [ -z "$PLATFORM_TYPE" ] || [ -z "$PLATFORM_ASSEMBLY" ]; then
          echo "##vso[task.logissue type=error]The WebApp has no NimBus__PlatformType/NimBus__PlatformAssembly setting, so it is still rendering NimBus's built-in catalog."
          exit 1
        fi
        echo "WebApp catalog: ${PLATFORM_TYPE} from ${PLATFORM_ASSEMBLY}"

        # The setting names a file the WebApp resolves against its content root. If the zip
        # did not actually carry it, every request that touches IPlatform throws at startup.
        ASSEMBLY_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
          "https://${SCM}/api/vfs/site/wwwroot/${PLATFORM_ASSEMBLY}" || true)
        if [ "$ASSEMBLY_STATUS" != "200" ]; then
          echo "##vso[task.logissue type=error]${PLATFORM_ASSEMBLY} is not in the deployed site (HTTP ${ASSEMBLY_STATUS}); the WebApp would fail every request that reads the catalog."
          exit 1
        fi

        # Topology last: every endpoint the catalog declares must have a topic in the
        # namespace. The expectation is exported from the same package the deployment
        # resolved, so this compares Azure against the catalog rather than against a list
        # hardcoded here that would rot the first time an endpoint is added.
        CATALOG=$(mktemp)
        nb topology export \
          --platform-package "${{ parameters.platformPackage }}" \
          --platform-feed "${{ parameters.platformFeed }}" \
          --output "$CATALOG"
        # The namespace nb provisioned into: the override, else the one recorded on the
        # resource group (a Premium namespace created to move to private mode), else the
        # conventional name.
        NAMESPACE="${{ parameters.serviceBusNamespaceName }}"
        if [ "$NAMESPACE" = "auto" ]; then
          NAMESPACE=$(az group show --name "${{ parameters.resourceGroup }}" \
            --query 'tags."nimbus-service-bus-namespace"' --output tsv)
        fi
        if [ -z "$NAMESPACE" ]; then NAMESPACE="sb-${{ parameters.solutionId }}-${{ parameters.environment }}"; fi
        TOPICS=$(mktemp)
        az servicebus topic list \
          --resource-group "${{ parameters.resourceGroup }}" \
          --namespace-name "$NAMESPACE" \
          --query "[].name" --output tsv > "$TOPICS"
        MISSING=""
        for ENDPOINT in $(grep -o '"id": *"[^"]*Endpoint"' "$CATALOG" | grep -o '[A-Za-z0-9]*Endpoint' | sort -u); do
          TOPIC=$(echo "$ENDPOINT" | tr '[:upper:]' '[:lower:]')
          if ! grep -qx "$TOPIC" "$TOPICS"; then MISSING="${MISSING} ${TOPIC}"; fi
        done
        if [ -n "$MISSING" ]; then
          echo "Topics in the namespace: $(tr '\n' ' ' < "$TOPICS")"
          echo "##vso[task.logissue type=error]The catalog declares endpoints with no topic:${MISSING}."
          exit 1
        fi
        echo "Topology matches ${{ parameters.platformPackage }}: $(tr '\n' ' ' < "$TOPICS")"
